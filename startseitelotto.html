<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Lotto Übersicht</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Lotto Übersicht</h1>
<center>
<img src="Logo.png" width="1000">
</center>
<br><br>
<button onclick="window.location.href='ziehungen.html'">Alle Ziehungen</button>
<button onclick="window.location.href='passwort.html'">Lottofee</button>
<button onclick="window.location.href='rangliste.html'">Rangliste</button>

<hr>

<table id="lottoTable">
    <thead>
        <tr>
            <th>Name</th>
            <th>Zahl 1</th>
            <th>Zahl 2</th>
            <th>Treffer 1</th>
            <th>Treffer 2</th>
            <th>Gesamt Treffer</th>
            <th>Gewinn (€)</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<h3 id="kasseAnzeige"></h3>
<h3 id="spielerAnzeige"></h3>
<h3 id="gesamtAnzeige"></h3>

<script>


// Spieler aus Speicher laden
let spieler = JSON.parse(localStorage.getItem("spieler"));

// Wenn noch keine Daten existieren → neu anlegen
if (!spieler) {
    spieler = [
        { name: "Abels", z1: 23, z2: 46 },
        { name: "Broich", z1: 2, z2: 47 },
        { name: "Flöck", z1: 3, z2: 9 },
        { name: "Franz", z1: 13, z2:45 },
        { name: "Gehlen", z1: 4, z2: 26 },
        { name: "Herten", z1:28, z2:33 },
        { name: "Kirsch", z1:17, z2:21 },
        { name: "Krahwinkel A.", z1:5, z2:20 },
        { name: "Krahwinkel N.", z1:40, z2:1 },
        { name: "Krämer", z1:15, z2:39 },
        { name: "Mehl", z1:7, z2:36 },
        { name: "Meurer", z1:29, z2:35 },
        { name: "Nix", z1:8, z2:27 },
        { name: "Offermann", z1:6, z2:22 },
        { name: "Otte", z1:10, z2:31 },   // Spieler!
        { name:"Phillipps", z1:14, z2:30 },
        { name:"Schiffer J.", z1:11, z2:44 },
        { name:"Schiffer T.", z1:16, z2:34 },
        { name:"Schnock", z1:19, z2:42 },
        { name:"Schoenen", z1:25, z2:49 },
        { name:"Spenrath", z1:24, z2:43 },
        { name:"V.Bardeleben", z1:32, z2:38 },
        { name:"Zumbroich", z1:12, z2:48 },

        // Kasse
        { name:"Kasse 18", z1:18, z2:0 },
        { name:"Kasse 37", z1:37, z2:0 },
        { name:"Kasse 41", z1:41, z2:0 },
        { name:"Kasse", z1:50, z2:0 }
    ];

    localStorage.setItem("spieler", JSON.stringify(spieler));
}

// Ziehungen laden
let ziehungen = JSON.parse(localStorage.getItem("ziehungen") || "[]");

// Kassen-Zahlen
const kassenZahlen = [18, 37, 41, 50];

// Prüfen ob Eintrag Kasse ist
function istKasse(s) {
    return s.name.startsWith("Kasse") || s.name === "Sonderzahlung";
}

// Kasse berechnen
function berechneKasse() {
    let kasse = 0;
    ziehungen.forEach(z => {
        [...new Set(z.zahlen)].forEach(num => {
            if (kassenZahlen.includes(num)) kasse += 5;
        });
    });
    return kasse;
}

// Spieler berechnen (ohne Kasse!)
function berechneSpieler() {
    let summe = 0;

    spieler.forEach(s => {
        if (istKasse(s)) return; // Kasse überspringen

        let t1 = 0, t2 = 0;

        ziehungen.forEach(z => {
            if (z.zahlen.includes(s.z1)) t1++;
            if (s.z2 !== 0 && z.zahlen.includes(s.z2)) t2++;
        });

        summe += (t1 + t2) * 5;
    });

    return summe;
}

// Tabelle rendern
function renderTable() {
    let tbody = document.querySelector("#lottoTable tbody");
    tbody.innerHTML = "";

    spieler.forEach(s => {
        let t1 = 0, t2 = 0;

        ziehungen.forEach(z => {
            if (z.zahlen.includes(s.z1)) t1++;
            if (s.z2 !== 0 && z.zahlen.includes(s.z2)) t2++;
        });

        let ges = t1 + t2;
        let geld = ges * 5;

        tbody.innerHTML += `
            <tr>
                <td>${s.name}</td>
                <td>${s.z1}</td>
                <td>${s.z2}</td>
                <td>${t1}</td>
                <td>${t2}</td>
                <td>${ges}</td>
                <td>${geld} €</td>
            </tr>
        `;
    });
}

// Anzeige unten
function render() {
    renderTable();

    let kasse = berechneKasse();
    let spielerGeld = berechneSpieler();
    let gesamt = kasse + spielerGeld;

    document.getElementById("kasseAnzeige").innerText =
        "Kasse gesamt: " + kasse + " €";

    document.getElementById("spielerAnzeige").innerText =
        "Spieler gesamt: " + spielerGeld + " €";

    document.getElementById("gesamtAnzeige").innerText =
        "Alles zusammen: " + gesamt + " €";
}

render();

</script>

</body>
</html>
