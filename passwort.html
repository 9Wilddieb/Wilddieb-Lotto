<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Lottofee</title>
    <link rel="stylesheet" href="style.css">
<style>
body {
font-family: Arial, sans-serif;
margin: 0;
padding: 0;
background-image: url('https://www.erft-kurier.de/imgs/61/1/7/8/8/1/5/2/4/9/tok_64d840c4f8b0b43287eae9a39a0e1f8a/w1900_h1266_x1796_y1197_9.Jaegerzug_3-c4fb6de587bba828.JPG'); 
      background-size: cover; 
      background-repeat: no-repeat; 
      background-position: center center; 
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
}
.login-container {
background-color: white;
padding: 30px;
border-radius: 8px;
box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
width: 300px;
}
h2 {
text-align: center;
margin-bottom: 20px;
}
label {
font-weight: bold;
display: block;
margin-bottom: 5px;
}
input {
width: 100%;
padding: 10px;
margin-bottom: 15px;
border: 1px solid #ccc;
border-radius: 4px;
}
button {
width: 100%;
padding: 10px;
background-color: #4CAF50;
color: white;
border: none;
border-radius: 4px;
cursor: pointer;
}
button:hover {
background-color: #45a049;
}
#message {
color: red;
text-align: center;
}
</style>
</head>
<body>




<div class="login-container">
<h2>Login</h2>

<form id="loginForm">
<label for="username">Benutzername:</label>
<input type="text" id="username" placeholder="Benutzername eingeben">

<label for="password">Passwort:</label>
<input type="password" id="password" placeholder="Passwort eingeben">

<button type="submit">Einloggen</button>
</form>

<p id="message"></p>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    const validUsername = "Lottofee";
    const validPassword = "Moritz2011!";

    if (username === validUsername && password === validPassword) {
        // Weiterleitung auf die Startseite
        window.location.href = "lottofee.html";
    } else {
        document.getElementById("message").style.color = "red";
        document.getElementById("message").textContent = "Falsche Benutzerdaten!";
    }
});
</script>
